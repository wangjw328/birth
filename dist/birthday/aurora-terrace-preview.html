<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111a"><title>极光露台 · 独立预览</title><link rel="stylesheet" href="./style.css?v=21"><link rel="stylesheet" href="./aurora-terrace.css?v=25"></head><body><main style="padding:8vw"><h1>极光露台预览</h1><p style="margin:25px 0">转动露台星盘，点亮三颗星，让极光在湖面上铺展开来。</p><button id="launch" class="primary">进入极光露台</button><p style="margin-top:25px"><a href="./" style="color:#d8bd88">返回完整生日体验</a></p><label style="display:block;margin-top:20px"><input type="checkbox" id="reduce"> 减少动态</label></main><script type="module">
import {AuroraTerraceExperience} from './aurora-terrace.js?v=27';
const reduced=document.querySelector('#reduce');reduced.checked=matchMedia('(prefers-reduced-motion:reduce)').matches;
const experience=new AuroraTerraceExperience({getReduced:()=>reduced.checked,getName:()=> '亲爱的你',onReturn:()=>document.querySelector('#launch').focus()});
document.querySelector('#launch').onclick=()=>experience.open();let last=performance.now();function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(!document.hidden)experience.update(dt);requestAnimationFrame(frame);}requestAnimationFrame(frame);experience.open();window.addEventListener('pagehide',()=>experience.dispose());
</script></body></html>
