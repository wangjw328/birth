<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>新增特殊空间 · 独立预览</title><link rel="stylesheet" href="./style.css?v=23"><link rel="stylesheet" href="./moon-garden.css?v=6"><link rel="stylesheet" href="./lake-mirror.css?v=7"><style>body{min-height:100dvh;background:#09111b;color:#eee8de;padding:8vw;font-family:system-ui}.preview-actions{display:flex;flex-wrap:wrap;gap:14px;margin:28px 0}.preview-actions button{border:1px solid #d8c7a955;border-radius:30px;padding:13px 21px;background:#172230;color:#f4eadb;cursor:pointer}p{color:#aebdca;line-height:1.8}label{display:block;margin-top:22px}</style></head><body><main><small>STARLIGHT ROOMS / LOCAL PREVIEW</small><h1>新增特殊空间</h1><p>独立检查月华流萤庭与湖心星镜台。完整生日流程中，仅在结尾完成后开放。</p><div class="preview-actions"><button id="garden">进入月华流萤庭</button><button id="lake">进入湖心星镜台</button></div><label><input id="reduce" type="checkbox"> 减少动态</label><p><a href="./" style="color:#d8bd88">返回完整生日体验</a></p></main><script type="module">import{MoonGardenExperience}from'./moon-garden.js?v=7';import{LakeMirrorExperience}from'./lake-mirror.js?v=12';const reduced=document.querySelector('#reduce'),gardenButton=document.querySelector('#garden'),lakeButton=document.querySelector('#lake');const garden=new MoonGardenExperience({getReduced:()=>reduced.checked,onReturn:()=>gardenButton.focus()});const lake=new LakeMirrorExperience({getReduced:()=>reduced.checked,onReturn:()=>lakeButton.focus()});gardenButton.onclick=()=>garden.open();lakeButton.onclick=()=>lake.open();let last=performance.now();function frame(now){const dt=Math.min((now-last)/1000,.05);last=now;garden.update(dt);lake.update(dt);requestAnimationFrame(frame)}requestAnimationFrame(frame);addEventListener('pagehide',()=>{garden.dispose();lake.dispose()});</script></body></html>
