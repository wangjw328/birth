<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>烟花与粒子生日祝福 · 预览</title><link rel="stylesheet" href="./style.css?v=28"><style>.preview-toolbar{position:fixed;z-index:30;top:20px;left:20px;right:20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px;background:#121723bb;border:1px solid #d6ba8033;border-radius:12px;color:#efdab3;font-size:12px}.preview-toolbar input,.preview-toolbar select{background:#1e2734;color:#f7e7cc;border:1px solid #76654a;padding:8px;border-radius:6px}.preview-toolbar button{background:#e1bd83;color:#21170a;padding:9px 15px;border:0;border-radius:6px}.preview-toolbar p{margin:0}.preview-toolbar a{color:#e5cda9}.wish-flip-control{top:auto!important;bottom:20px}@media(max-height:500px){.preview-toolbar{top:6px;left:8px;right:8px;padding:6px;gap:6px;font-size:10px}.preview-toolbar label{display:flex;align-items:center;gap:5px;white-space:nowrap;flex:0 0 auto}.preview-toolbar input{width:84px!important}.preview-toolbar input,.preview-toolbar button,.preview-toolbar select{padding:5px;font-size:10px}.preview-toolbar p{display:none}.wish-flip-control{bottom:10px!important;font-size:10px!important;padding:7px 10px!important}}</style><body data-view="ending"><div id="room-stage"></div><div class="vignette"></div><canvas id="particle-wish" role="img" hidden></canvas><div class="preview-toolbar"><label>姓名 <input id="name" maxlength="20" value="小宇"></label><select id="scene" aria-label="预览场景"><option value="rings">星环飞船</option><option value="aurora">极光木屋</option><option value="starlake">银河小屋</option><option value="sunset">海滨屋</option><option value="garden">月色花房</option></select><button id="play" disabled>正在加载…</button><button id="voyage-only">预览驶入星海</button><button id="particles-only">直接预览粒子</button><p id="status" role="status">正在准备场景</p><a href="./">进入完整生日体验 ↗</a></div><script type="module">
import {BirthdayRoom} from './photographic-room.js?v=11';import {WindowFireworks} from './window-fireworks.js?v=19';import {ParticleWish} from './particle-wish.js?v=10';
const $=id=>document.getElementById(id),room=new BirthdayRoom($('room-stage'));await room.ready;const show=new WindowFireworks(room.scene),wish=new ParticleWish($('particle-wish'),phase=>{if(phase!=='fireworks')show.stop();$('status').textContent=({fireworks:'烟花正在绽放…',transition:'远离行星，驶入星海…',gathering:'星尘汇聚成祝福 → 旋转星核',complete:'星核已点亮 · 可回看祝福'})[phase];});
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;room.reduced=show.reduced=wish.reduced=reduced;let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(!document.hidden){show.update(dt);wish.update(dt);room.update(dt,now/1000);}requestAnimationFrame(frame);}requestAnimationFrame(frame);
async function play(){ $('play').disabled=true;try{wish.stop();show.stop();await room.setScene($('scene').value);room.setView('ending');show.cosmic=room.isShip;show.start();wish.start($('name').value,room.sceneName);}catch{$('status').textContent='场景加载失败，请重试。';}finally{$('play').disabled=false;$('play').textContent='重新播放';}}
$('play').onclick=play;$('voyage-only').onclick=()=>{show.stop();wish.start($('name').value,room.sceneName);wish.elapsed=reduced?.85:9.15;};$('particles-only').onclick=()=>{show.stop();wish.start($('name').value,room.sceneName);wish.elapsed=reduced?1.1:room.isShip?12:9;};await play();
</script></body></html>
