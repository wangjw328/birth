<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>烟花与粒子生日祝福 · 预览</title><link rel="stylesheet" href="./style.css?v=11"><style>.preview-toolbar{position:fixed;z-index:30;top:20px;left:20px;right:20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px;background:#121723bb;border:1px solid #d6ba8033;border-radius:12px;color:#efdab3;font-size:12px}.preview-toolbar input,.preview-toolbar select{background:#1e2734;color:#f7e7cc;border:1px solid #76654a;padding:8px;border-radius:6px}.preview-toolbar button{background:#e1bd83;color:#21170a;padding:9px 15px;border:0;border-radius:6px}.preview-toolbar p{margin:0}.preview-toolbar a{color:#e5cda9}</style><body data-view="ending"><div id="room-stage"></div><div class="vignette"></div><canvas id="particle-wish" role="img" hidden></canvas><div class="preview-toolbar"><label>姓名 <input id="name" maxlength="20" value="小宇"></label><select id="scene" aria-label="预览场景"><option value="rings">星环飞船</option><option value="aurora">极光木屋</option><option value="starlake">银河小屋</option><option value="sunset">海滨屋</option><option value="garden">月色花房</option></select><button id="play" disabled>正在加载…</button><p id="status" role="status">正在准备场景</p><a href="./">进入完整生日体验 ↗</a></div><script type="module">
import {BirthdayRoom} from './photographic-room.js?v=11';import {WindowFireworks} from './window-fireworks.js?v=19';import {ParticleWish} from './particle-wish.js?v=3';
const $=id=>document.getElementById(id),room=new BirthdayRoom($('room-stage'));await room.ready;const show=new WindowFireworks(room.scene),wish=new ParticleWish($('particle-wish'),phase=>{if(phase!=='fireworks')show.stop();$('status').textContent=({fireworks:'烟花正在绽放…',gathering:'星光正在汇聚成祝福…',complete:'汇聚完成 · 可修改姓名再播放'})[phase];});
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;room.reduced=show.reduced=wish.reduced=reduced;let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(!document.hidden){show.update(dt);wish.update(dt);room.update(dt,now/1000);}requestAnimationFrame(frame);}requestAnimationFrame(frame);
async function play(){ $('play').disabled=true;try{wish.stop();show.stop();await room.setScene($('scene').value);room.setView('ending');show.cosmic=room.isShip;show.start();wish.start($('name').value);}catch{$('status').textContent='场景加载失败，请重试。';}finally{$('play').disabled=false;$('play').textContent='重新播放';}}
$('play').onclick=play;await play();
</script></body></html>
